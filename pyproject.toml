[tool.poetry]
name = "agent-orchestration"
version = "0.1.0"
description = "A learning-focused agent orchestration service with LangChain, LangGraph, and RAG"
authors = ["ervikassingh"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
core-agent = { path = "packages/core-agent", develop = true }
rag-pipeline = { path = "packages/rag-pipeline", develop = true }
api-server = { path = "packages/api-server", develop = true }
tool-library = { path = "packages/tool-library", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.3"
mypy = "^1.8"
pre-commit = "^3.6"

[tool.poetry.scripts]
orchestrate = "api_server.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["node_modules", ".git", "dist", "build"]