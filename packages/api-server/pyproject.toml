[tool.poetry]
name = "api-server"
version = "0.1.0"
description = "FastAPI server exposing agent orchestration endpoints"
authors = ["ervikassingh"]
license = "MIT"
packages = [
    { include = "*.py", from = "src" },
    { include = "routes", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
orchestrator = { path = "../orchestrator", develop = true }
rag-pipeline = { path = "../rag-pipeline", develop = true }
tool-library = { path = "../tool-library", develop = true }
fastapi = "^0.141"
starlette = "^1.6"
uvicorn = { version = "^0.52", extras = ["standard"] }
pydantic = "^2.13"
pydantic-settings = "^2.15"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"