[tool.poetry]
name = "rag-pipeline"
version = "0.1.0"
description = "Retrieval-Augmented Generation pipeline with document loading, chunking, embedding, and retrieval"
authors = ["ervikassingh"]
license = "MIT"
packages = [{ include = "rag_pipeline" }]

[tool.poetry.dependencies]
python = "^3.11"
orchestrator = { path = "../orchestrator", develop = true }
langchain = "^1.4"
langchain-core = "^1.6"
langchain-openai = "^1.6"
langchain-community = "^0.4"
langchain-chroma = "^1.1"
langchain-text-splitters = "^1.1"
chromadb = "^1.5"
pypdf = "^6.18"
tiktoken = "^0.14"
pydantic = "^2.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"