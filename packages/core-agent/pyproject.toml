[tool.poetry]
name = "core-agent"
version = "0.1.0"
description = "Core agent orchestration engine with LangChain and LangGraph"
authors = ["Ervikas Singh"]
license = "MIT"
readme = "README.md"
packages = [{ include = "core_agent" }]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^0.3"
langchain-core = "^0.3"
langgraph = "^0.3"
langchain-openai = "^0.3"
langchain-community = "^0.3"
pydantic = "^2.6"
pydantic-settings = "^2.2"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"