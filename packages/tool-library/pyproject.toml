[tool.poetry]
name = "tool-library"
version = "0.1.0"
description = "Reusable tool abstractions and implementations for agent orchestration"
authors = ["ervikassingh"]
license = "MIT"
packages = [
    { include = "*.py", from = "src" },
    { include = "tools", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.13"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
