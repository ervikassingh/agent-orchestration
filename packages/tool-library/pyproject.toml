[tool.poetry]
name = "tool-library"
version = "0.1.0"
description = "Reusable tool abstractions and implementations for agent orchestration"
authors = ["ervikassingh"]
license = "MIT"
packages = [{ include = "tool_library" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
