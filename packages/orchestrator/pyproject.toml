[tool.poetry]
name = "orchestrator"
version = "0.1.0"
description = "LangGraph-based tool-calling orchestrator"
authors = ["ervikassingh"]
license = "MIT"
packages = [{ include = "*.py", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^1.4"
langchain-core = "^1.6"
langgraph = "^1.2"
langchain-openai = "^1.6"
langchain-community = "^0.4"
pydantic = "^2.13"
pydantic-settings = "^2.15"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"